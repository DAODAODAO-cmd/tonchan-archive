<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>东启介 资讯站｜分类浏览</title>
<style>
:root{--bg:#fbf6ef;--bg2:#f4ece1;--card:#fffdf9;--ink:#3b3631;--muted:#8d847a;--line:#ece3d6;--sage:#7f9c88;--sage-soft:#e6eee7;--peach:#e7a98c;--peach-soft:#fbe9df;--rose-soft:#f8e4e6;--sky-soft:#e5eef6;--butter-soft:#fbf1d6;--lav-soft:#eee9f6;--shadow:0 6px 24px rgba(120,96,70,.08),0 1px 3px rgba(120,96,70,.06);--serif:"Noto Serif SC","Songti SC","Source Han Serif SC",Georgia,serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.nav{position:sticky;top:0;z-index:20;background:rgba(251,246,239,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{font-family:var(--serif);font-size:18px;white-space:nowrap}.logo span{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--peach-soft);color:#b8694a;font-size:13px;margin-right:8px}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:auto}.pills::-webkit-scrollbar{display:none}
.pills a{padding:7px 14px;border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap}
.pills a.on{background:var(--sage);color:#fff}.pills a:hover{background:var(--card)}
header.h{padding:38px 0 8px}
header.h h1{font-family:var(--serif);font-weight:600;font-size:34px;margin:0;letter-spacing:.05em}
header.h p{color:var(--muted);margin:6px 0 0;font-size:13px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 8px}
.tools input{flex:1;min-width:200px;border:0;background:var(--card);border-radius:999px;padding:10px 18px;box-shadow:var(--shadow);font-size:14px;outline:none}
.tools button{border:0;background:var(--card);border-radius:999px;padding:9px 16px;font-size:13px;color:var(--muted);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tools button.on{background:var(--ink);color:#fff}
.year{display:flex;align-items:baseline;gap:12px;margin:34px 0 16px}
.year h2{font-family:var(--serif);font-size:30px;font-weight:600;margin:0;color:#b46a4b}
.year span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s}
.card:hover{transform:translateY(-4px)}
.card .img{aspect-ratio:4/5;background:linear-gradient(135deg,#f4ece1,#efe6f2);overflow:hidden;position:relative}
.card .img img{width:100%;height:100%;object-fit:cover;object-position:top}
.card .img .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;font-family:var(--serif);color:#8a7a68}
.card .img .ph b{font-size:20px;line-height:1.45;color:#5d5045}
.card .img .ph i{font-style:normal;font-size:44px;color:#d9ccbb;position:absolute;top:18px;left:22px}
.card .img .tag{position:absolute;left:14px;top:14px;font-size:11.5px;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.92)}
.card .img .soon{left:auto;right:14px;background:var(--rose-soft);color:#b45d6c}
.card .b{padding:16px 20px 20px}
.card .meta{font-size:12px;color:var(--muted)}
.card h3{font-size:16px;line-height:1.5;margin:4px 0 4px;font-weight:600}
.card .ja{font-size:12px;color:var(--muted);margin:0 0 6px}
.card .role{font-size:13px;color:#6b8a75}
.card .note{font-size:12.5px;color:#6a625a;margin-top:8px}
.card .pend{display:inline-block;margin-top:8px;font-size:11px;padding:2px 9px;border-radius:999px;background:var(--butter-soft);color:#9a7a2a}
.card .lk{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.card .lk a{font-size:12px;padding:4px 11px;border-radius:999px;background:var(--sky-soft);color:#4f7393}
.v .img{aspect-ratio:16/9}
.news{list-style:none;margin:0;padding:6px 26px;background:var(--card);border-radius:24px;box-shadow:var(--shadow)}
.news li{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:16px 0;border-bottom:1px dashed var(--line)}
.news li:last-child{border:0}.news time{color:var(--muted);font-size:13px}.news p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{margin-top:50px;padding:30px 0 50px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.wrap{padding:0 14px}.grid{grid-template-columns:1fr}.news li{grid-template-columns:1fr;gap:2px}header.h h1{font-size:26px}}
</style>
</head>
<body>
<nav class="nav"><div class="wrap"><a class="logo" href="index.html"><span>東</span>东启介 资讯站</a><div class="pills" id="pills"></div></div></nav>
<div class="wrap">
  <header class="h"><h1 id="title"></h1><p id="desc"></p></header>
  <div class="tools"><input id="q" type="search" placeholder="搜索标题、角色、杂志名…"><span id="extra"></span></div>
  <main id="out"></main>
</div>
<footer><div class="wrap">东启介资讯站 · 粉丝整理 · 非官方。图片版权归原权利人所有；标“待核”的条目来自二手市场等线索，以官方为准。</div></footer>
<script src="data/archive.js"></script>
<script src="data/hub.js"></script>
<script>
'use strict';
const A=window.ARCHIVE,H=window.HUB,$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const fmt=d=>d?d.replaceAll('-','.'):'';
const imgOf=im=>im?(im.asset&&A.assets[im.asset])||im.url||'':'';
const G={
  stage:{t:'舞台',cats:['舞台','朗读剧']},
  screen:{t:'影视',cats:['电视剧','网络剧','电影','动画电影']},
  mag:{t:'杂志',cats:['杂志']},
  photo:{t:'写真·出版',cats:['写真／出版']},
  int:{t:'采访·连载',cats:['采访／连载','本人摄影／随笔']},
  radio:{t:'广播',cats:['广播／音声']},
  variety:{t:'综艺·节目',cats:['电视节目']},
  live:{t:'音乐会·活动',cats:['音乐会','活动']},
  schedule:{t:'即将到来',special:1},
  news:{t:'最新动态',special:1},
  videos:{t:'视频',special:1}
};
const p=new URLSearchParams(location.search);let g=G[p.get('g')]?p.get('g'):'stage';
$('pills').innerHTML=Object.entries(G).map(([k,v])=>'<a class="'+(k===g?'on':'')+'" href="list.html?g='+k+'">'+v.t+'</a>').join('');
document.title='东启介｜'+G[g].t;$('title').textContent=G[g].t;
let filt='',sub='';
function card(e){const im=e.images&&e.images[0];const soon=e.date>today;
  return '<article class="card"><a class="img" href="archive.html#'+esc(e.id)+'">'+(im?'<img src="'+esc(imgOf(im))+'" alt="'+esc(im.caption)+'" loading="lazy">':'<div class="ph"><i>'+esc(e.date.slice(0,4))+'</i><b>'+esc(e.title)+'</b></div>')+'<span class="tag">'+esc(e.category)+'</span>'+(soon?'<span class="tag soon">未来</span>':'')+'</a>'+
  '<div class="b"><div class="meta">'+fmt(e.date)+(e.end?' — '+fmt(e.end):'')+'</div><h3>'+esc(e.title)+'</h3><p class="ja">'+esc(e.japanese)+'</p>'+(e.role&&e.role!=='本人'?'<div class="role">饰 '+esc(e.role)+'</div>':'')+(e.note?'<div class="note">'+esc(e.note)+'</div>':'')+(e.pending?'<span class="pend">待核</span>':'')+'<div class="lk"><a href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">原文／官网 ↗</a></div></div></article>'}
function vcard(v){const th=(v.asset&&A.assets[v.asset])||v.thumbnail;return '<a class="card v" href="'+esc(v.url)+'" target="_blank" rel="noopener noreferrer"><div class="img">'+(th?'<img src="'+esc(th)+'" alt="" loading="lazy">':'<div class="ph"><b>'+esc(v.platform)+'</b></div>')+'<span class="tag">'+esc(v.platform||'YouTube')+'</span></div><div class="b"><div class="meta">'+esc(v.channel)+(v.uploadDate?' · '+fmt(v.uploadDate):'')+'</div><h3 style="font-size:14px">'+esc(v.title)+'</h3></div></a>'}
function byYear(list,render,asc){const ys={};list.forEach(x=>{const y=(x._d||'').slice(0,4)||'—';(ys[y]=ys[y]||[]).push(x)});return Object.keys(ys).sort((a,b)=>asc?a.localeCompare(b):b.localeCompare(a)).map(y=>'<div class="year"><h2>'+y+'</h2><span>'+ys[y].length+' 条</span></div><div class="grid">'+ys[y].map(render).join('')+'</div>').join('')}
function match(s){return !filt||s.toLowerCase().includes(filt)}
function draw(){let html='';
  if(g==='news'){$('desc').textContent='按时间从新到旧。';const L=H.news.slice().sort((a,b)=>b.date.localeCompare(a.date)).filter(n=>match(n.title+n.text));html='<ul class="news">'+L.map(n=>'<li><time>'+fmt(n.date)+'</time><div><a href="'+esc(n.url)+'" target="_blank" rel="noopener noreferrer"><b>'+esc(n.title)+'</b></a><p>'+esc(n.text)+'</p></div></li>').join('')+'</ul>'}
  else if(g==='videos'){const plats=['本人出镜','YouTube','B站','niconico'];sub=sub||'本人出镜';$('extra').innerHTML=plats.map(x=>'<button class="'+(x===sub?'on':'')+'" data-s="'+x+'">'+x+'</button>').join('');
    const isMe=v=>/東\s?啓介|东启介|Higashi|あさステ|WE25|聴活|カメラ旅/i.test(v.title+' '+(v.rel||''))||/ワタナベエンターテインメント/.test(v.channel||'');
    let L=A.videos.filter(v=>sub==='本人出镜'?isMe(v):sub==='YouTube'?(v.platform||'YouTube')==='YouTube':v.platform===sub).filter(v=>match(v.title+v.channel));L.forEach(v=>v._d=v.uploadDate||(v.years&&v.years[0])||'');L.sort((a,b)=>b._d.localeCompare(a._d));$('desc').textContent=L.length+' 条 · 从新到旧';html=byYear(L,vcard)}
  else if(g==='schedule'){$('desc').textContent='进行中与未来的日程，按日期先后。联动、展览类以官方公告为准。';let L=A.events.filter(e=>e.date>=today||(e.end&&e.end>=today)).filter(e=>match(e.title+e.japanese));L.forEach(e=>e._d=e.date);L.sort((a,b)=>a.date.localeCompare(b.date));html=byYear(L,card,true)}
  else{const cats=G[g].cats;let L=A.events.filter(e=>cats.includes(e.category)).filter(e=>match(e.title+e.japanese+e.role+e.note));L.forEach(e=>e._d=e.date);L.sort((a,b)=>b.date.localeCompare(a.date));const withImg=L.filter(e=>e.images&&e.images.length).length;$('desc').textContent=L.length+' 条 · 从新到旧 · 有图 '+withImg+' 条';$('extra').innerHTML='';html=byYear(L,card)}
  $('out').innerHTML=html||'<div class="empty">暂无</div>'}
$('q').oninput=e=>{filt=e.target.value.trim().toLowerCase();draw()};
$('extra').onclick=e=>{const b=e.target.closest('button');if(b){sub=b.dataset.s;draw()}};
document.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.style.visibility='hidden'},true);
draw();
</script>
</body>
</html>
