.top{position:sticky;top:0;z-index:20;background:rgba(251,246,239,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}

.logo{font-family:var(--serif);font-size:18px;white-space:nowrap}.logo span{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--peach-soft);color:#b8694a;font-size:13px;margin-right:8px}

.cats a.on{background:var(--sage);color:#fff}

.years{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 10px}.years::-webkit-scrollbar{display:none}

header.h{padding:30px 0 4px}

.card .b{padding:14px 16px 16px}

.card h3{font-size:14.5px;line-height:1.5;margin:3px 0 3px;font-weight:600}

.card summary{cursor:pointer;color:var(--muted)}

.tl .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.tl .tx{background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:background .2s}

.tl .c{display:inline-block;font-size:11px;padding:0 8px;border-radius:999px;margin-right:6px;background:var(--sage-soft);color:#5d7d67}
.news{list-style:none;margin:0;padding:6px 24px;background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.news li{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.news li:last-child{border:0}.news time{color:var(--muted);font-size:13px}.news p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{margin-top:50px;padding:30px 0 50px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

  header.h h1 .en{display:none}
  body[data-g=all] .cats{display:none}
  header.h{padding-top:20px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 4px;width:calc(100% + 28px)}.chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;white-space:nowrap}
  .tools{flex-direction:column;align-items:stretch;gap:8px}.tools input{min-width:0}
}
.vl{margin:6px 0 0;padding-left:0;list-style:none;max-height:220px;overflow:auto}.vl li{margin:3px 0;font-size:12px}.vl a{color:inherit;text-decoration:underline dotted}

  mag:{t:'杂志',en:'MAGAZINE',cats:['杂志']},

  $('years').innerHTML=keys.map(y=>'<a href="#y'+y+'">'+y+'</a>').join('');
