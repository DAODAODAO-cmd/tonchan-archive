<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" href="assets/img/favicon.png"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png"><meta name="theme-color" content="#fbf6ef"><title>东启介 编年档案</title>
<style>
:root{--bg:#fbf6ef;--bg2:#f4ece1;--card:#fffdf9;--ink:#3b3631;--muted:#8d847a;--line:#ece3d6;--sage:#7f9c88;--sage-soft:#e6eee7;--peach:#e7a98c;--peach-soft:#fbe9df;--rose-soft:#f8e4e6;--sky-soft:#e5eef6;--butter-soft:#fbf1d6;--lav-soft:#eee9f6;--shadow:0 6px 24px rgba(120,96,70,.08),0 1px 3px rgba(120,96,70,.06);--serif:"Noto Serif SC","Songti SC","Source Han Serif SC",Georgia,serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.top{position:sticky;top:0;z-index:20;background:rgba(251,246,239,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:58px}
.logo{font-family:var(--serif);font-size:18px;white-space:nowrap}.logo span{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--peach-soft);color:#b8694a;font-size:13px;margin-right:8px}
.home{margin-left:auto;font-size:13px;color:var(--muted)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 0 10px}.cats::-webkit-scrollbar{display:none}
.cats a{padding:7px 15px;border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.cats a.on{background:var(--sage);color:#fff}
.cats .sep{width:1px;background:var(--line);margin:4px 4px}
.years{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 10px}.years::-webkit-scrollbar{display:none}
.years a{font-family:var(--serif);font-size:13px;padding:3px 10px;border-radius:999px;color:var(--muted)}
.years a.on,.years a:hover{background:var(--peach-soft);color:#b46a4b}
header.h{padding:30px 0 4px}
header.h h1{font-family:var(--serif);font-weight:600;font-size:32px;margin:0;letter-spacing:.05em}
header.h p{color:var(--muted);margin:4px 0 0;font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 4px}
.tools input{flex:1;min-width:200px;border:0;background:var(--card);border-radius:999px;padding:10px 18px;box-shadow:var(--shadow);font-size:14px;outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:0;background:var(--card);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--muted);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.chips button.on{background:var(--ink);color:#fff}
.chips.sm button{padding:5px 12px;font-size:12px}
.chips.sm button.on{background:var(--sage)}
.year{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px}
.year h2{font-family:var(--serif);font-size:30px;font-weight:600;margin:0;color:#b46a4b}
.year span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.grid.ls{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s}
.card:hover{transform:translateY(-4px)}
.card .img{aspect-ratio:3/4;background:linear-gradient(135deg,#f4ece1,#efe6f2);overflow:hidden;position:relative}
.ls .card .img{aspect-ratio:16/10}
.card .img img{width:100%;height:100%;object-fit:cover;object-position:top}
.ls .card .img img{object-position:center}
.card .img .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;font-family:var(--serif)}
.card .img .ph b{font-size:17px;line-height:1.45;color:#5d5045}
.card .img .ph i{font-style:normal;font-size:38px;color:#d9ccbb;position:absolute;top:14px;left:18px}
.tag{position:absolute;left:12px;top:12px;font-size:11px;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.92)}
.tag.r{left:auto;right:12px;background:var(--rose-soft);color:#b45d6c}
.card .b{padding:14px 16px 16px}
.card .meta{font-size:11.5px;color:var(--muted)}
.card h3{font-size:14.5px;line-height:1.5;margin:3px 0 3px;font-weight:600}
.card .ja{font-size:11.5px;color:var(--muted);margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .role{font-size:12.5px;color:#6b8a75}
.card details{margin-top:6px;font-size:12px;color:#6a625a}
.card summary{cursor:pointer;color:var(--muted)}
.pend{display:inline-block;margin-top:6px;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--butter-soft);color:#9a7a2a}
.card .lk{margin-top:8px}.card .lk a{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--sky-soft);color:#4f7393}
/* timeline (全部) */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl:before{content:"";position:absolute;left:104px;top:0;bottom:0;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:90px 28px 76px minmax(0,1fr);gap:0 12px;align-items:center;padding:8px 0}
.tl time{font-size:12.5px;color:var(--muted);text-align:right}
.tl .dot{width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--peach);justify-self:center;position:relative;z-index:1}
.tl .th{width:76px;height:76px;border-radius:14px;overflow:hidden;background:var(--bg2);display:grid;place-items:center;font-family:var(--serif);color:#cdbfae}
.tl .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.tl .tx{background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:background .2s}
.tl a:hover .tx{background:#fff}
.tl .tx b{font-size:14px;font-weight:600}
.tl .tx small{display:block;color:var(--muted);font-size:12px}
.tl .c{display:inline-block;font-size:11px;padding:0 8px;border-radius:999px;margin-right:6px;background:var(--sage-soft);color:#5d7d67}
.news{list-style:none;margin:0;padding:6px 24px;background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.news li{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.news li:last-child{border:0}.news time{color:var(--muted);font-size:13px}.news p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{margin-top:50px;padding:30px 0 50px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer a{color:var(--sage)}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.ls{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.wrap{padding:0 14px}.grid,.grid.ls{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tl:before{left:70px}.tl li{grid-template-columns:58px 24px 56px minmax(0,1fr);gap:0 8px}.tl .th{width:56px;height:56px}header.h h1{font-size:26px}}

.tabbar{display:none}
@media (max-width:720px){
  body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;background:rgba(255,253,249,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ece3d6;border-radius:22px;box-shadow:0 8px 28px rgba(120,96,70,.16);padding:6px;justify-content:space-between}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:16px;color:#8d847a;text-decoration:none;font-size:11px;line-height:1.2}
  .tabbar a i{font-style:normal;font-size:18px;line-height:1}
  .tabbar a small{font-size:8px;letter-spacing:.08em;opacity:.6}.tabbar a.main{background:#7f9c88;color:#fff;margin:0 2px}
  .tabbar a.on{color:#3b3631;font-weight:600}
}
.vl{margin:6px 0 0;padding-left:0;list-style:none;max-height:220px;overflow:auto}.vl li{margin:3px 0;font-size:12px}.vl a{color:inherit;text-decoration:underline dotted}
.h h1 .en{display:block;font-size:11px;letter-spacing:.2em;color:var(--muted,#9a8f84);font-weight:500;margin-bottom:4px;order:-1}</style>
<script>document.addEventListener('load',function(e){var i=e.target;if(i&&i.tagName==='IMG'&&i.naturalHeight>i.naturalWidth*1.05&&!i.style.objectPosition)i.style.objectPosition='50% 15%'},true)</script>

<body>
<div class="top"><div class="wrap">
  <div class="bar"><a class="logo" href="index.html"><span>東</span>东启介 编年档案</a><a class="home" href="index.html">← 资讯首页</a></div>
  <nav class="cats" id="cats"></nav>
  <nav class="years" id="years"></nav>
</div></div>
<div class="wrap">
  <header class="h"><h1 id="title"></h1><p id="desc"></p></header>
  <div class="tools"><input id="q" type="search" placeholder="搜索标题、角色、杂志名、频道…"></div>
  <div class="tools"><div class="chips" id="chips"></div><div class="chips sm" id="chips2"></div></div>
  <main id="out"></main>
</div>
<footer><div class="wrap">东启介资讯站 · 非官方 · <a href="archive.html">旧版档案</a></div></footer>
<script src="data/archive.js?v=1119e"></script>
<script src="data/hub.js?v=1119e"></script>
<script>
'use strict';
const A=window.ARCHIVE,H=window.HUB,$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const fmt=d=>d?d.replaceAll('-','.'):'';
const WORKC=['舞台','音乐会','音乐剧','朗读剧','电视剧','电影','网络剧'];const thumbOf=e=>{const ims=e.images||[];if(WORKC.includes(e.category)){if(e.cardPoster)return {url:e.cardPoster,caption:'海报'};const p=ims.find(i=>/海报|主视觉|宣传单|ビジュアル/i.test(i.caption||''));if(p)return p}return ims[0]};const imgOf=im=>im?(im.asset&&A.assets[im.asset])||im.url||'':'';
/* 分类：作品 / 媒体 / 其他 三组；ls=横版卡片 */
const G={
  all:{t:'全部编年',en:'ARCHIVE',d:'从出道到现在，按时间排，上面可以按类别筛。'},
  stage:{t:'舞台',en:'STAGE',cats:['舞台','朗读剧']},
  screen:{t:'影视',en:'SCREEN',cats:['电视剧','网络剧','电影','动画电影'],ls:1},
  live:{t:'音乐会',en:'LIVE',cats:['音乐会'],ls:1},
  _1:{sep:1},
  mag:{t:'杂志',en:'MAGAZINE',cats:['杂志']},
  int:{t:'采访·连载',en:'INTERVIEW',cats:['采访／连载','本人摄影／随笔'],ls:1},
  radio:{t:'广播',en:'RADIO',cats:['广播／音声'],ls:1},
  variety:{t:'综艺·节目',en:'TV SHOW',cats:['电视节目'],ls:1},
  _2:{sep:1},
  photo:{t:'写真·影像·音乐',en:'RELEASE',cats:['写真／出版']},
  event:{t:'活动',en:'EVENT',cats:['活动'],ls:1},
  goods:{t:'周边·生写真',en:'GOODS',cats:['周边'],ls:1},
  videos:{t:'视频',en:'VIDEO',ls:1},
  _3:{sep:1},
  schedule:{t:'即将到来',en:'SCHEDULE'},
  news:{t:'最新动态',en:'NEWS'}
};
const p=new URLSearchParams(location.search);let g=G[p.get('g')]&&!G[p.get('g')].sep?p.get('g'):'all';
$('cats').innerHTML=Object.entries(G).map(([k,v])=>v.sep?'<span class="sep"></span>':'<a class="'+(k===g?'on':'')+'" href="list.html?g='+k+'">'+v.t+'</a>').join('');
document.title='东启介｜'+G[g].t;$('title').innerHTML=(G[g].en?'<small class="en">'+G[g].en+'</small>':'')+esc(G[g].t);
let filt='',vt='全部',vp='全平台';
const match=s=>!filt||s.toLowerCase().includes(filt);
function card(e){const im=thumbOf(e);return '<article class="card" id="'+esc(e.id)+'"><a class="img" href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">'+(im?'<img src="'+esc(imgOf(im))+'"'+(im.pos?' style="object-position:'+esc(im.pos)+'"':'')+' alt="'+esc(im.caption)+'" loading="lazy">':'<div class="ph"><i>'+esc(e.date.slice(0,4))+'</i><b>'+esc(e.title)+'</b></div>')+'<span class="tag">'+esc(e.category)+'</span>'+(e.date>today?'<span class="tag r">未来</span>':'')+'</a><div class="b"><div class="meta">'+fmt(e.date)+(e.end?' — '+fmt(e.end):'')+'</div><h3>'+esc(e.title)+'</h3><p class="ja">'+esc(e.japanese)+'</p>'+(e.role&&e.role!=='本人'?'<div class="role">饰 '+esc(e.role)+'</div>':'')+((e.note||(e.videos&&e.videos.length))?'<details><summary>详情'+(e.videos&&e.videos.length?' · ▶ '+e.videos.length+' 个视频':'')+'</summary>'+esc(e.note||'')+(e.videos&&e.videos.length?'<ul class="vl">'+e.videos.map(v=>'<li><a href="'+esc(v.url)+'" target="_blank" rel="noopener noreferrer">▶ '+esc(v.title)+'</a></li>').join('')+'</ul>':'')+'</details>':'')+(e.pending?'<span class="pend">待核</span>':'')+'</div></article>'}
function vcard(v){const th=(v.asset&&A.assets[v.asset])||v.thumbnail;return '<a class="card" href="'+esc(v.url)+'" target="_blank" rel="noopener noreferrer"><div class="img">'+(th?'<img src="'+esc(th)+'" alt="" loading="lazy">':'<div class="ph"><b>'+esc(v.title)+'</b></div>')+'<span class="tag">'+esc(v.platform||'YouTube')+'</span></div><div class="b"><div class="meta">'+esc(v.channel)+(v._d?' · '+fmt(v._d):'')+'</div><h3>'+esc(v.title)+'</h3></div></a>'}
function tlrow(e){const im=thumbOf(e);return '<li id="'+esc(e.id)+'"><time>'+(fmt(e.date).slice(5)||e.date)+'</time><span class="dot"></span><a class="th" href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">'+(im?'<img src="'+esc(imgOf(im))+'"'+(im.pos?' style="object-position:'+esc(im.pos)+'"':'')+' alt="" loading="lazy">':esc(e.date.slice(2,4)))+'</a><a href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer"><div class="tx"><span class="c">'+esc(e.category)+'</span><b>'+esc(e.title)+'</b><small>'+esc(e.japanese)+(e.role&&e.role!=='本人'?' · 饰 '+esc(e.role):'')+(e.pending?' · 待核':'')+'</small></div></a></li>'}
function grouped(list,render,asc,wrapCls){const ys={};list.forEach(x=>{const y=(x._d||'').slice(0,4)||'—';(ys[y]=ys[y]||[]).push(x)});const keys=Object.keys(ys).sort((a,b)=>asc?a.localeCompare(b):b.localeCompare(a));
  $('years').innerHTML=keys.map(y=>'<a href="#y'+y+'">'+y+'</a>').join('');
  return keys.map(y=>'<section id="y'+y+'"><div class="year"><h2>'+y+'</h2><span>'+ys[y].length+' 条</span></div>'+(wrapCls==='tl'?'<ul class="tl">'+ys[y].map(render).join('')+'</ul>':'<div class="'+wrapCls+'">'+ys[y].map(render).join('')+'</div>')+'</section>').join('')}
const VT={'全部':null,'本人歌唱':['本人歌唱'],'舞台·演出':['舞台／剧集','演出／歌唱'],'采访·发布会':['采访／发布会'],'节目·综艺':['节目／其他'],'SNS·直播':['SNS／直播'],'剧集cut':['剧集cut'],'幕后·花絮':['幕后／拍摄'],'预告·宣传':['预告／宣传','官网视频'],'广播':['广播／音声']};
function draw(){let html='';$('chips').innerHTML='';$('chips2').innerHTML='';$('years').innerHTML='';
  if(g==='news'){$('desc').textContent='按时间从新到旧。';const L=H.news.slice().sort((a,b)=>b.date.localeCompare(a.date)).filter(n=>match(n.title+n.text));html='<ul class="news">'+L.map(n=>'<li><time>'+fmt(n.date)+'</time><div><a href="'+esc(n.url)+'" target="_blank" rel="noopener noreferrer"><b>'+esc(n.title)+'</b></a><p>'+esc(n.text)+'</p></div></li>').join('')+'</ul>'}
  else if(g==='videos'){
    $('chips').innerHTML=Object.keys(VT).map(x=>'<button class="'+(x===vt?'on':'')+'" data-vt="'+x+'">'+x+'</button>').join('');
    $('chips2').innerHTML=['全平台','YouTube','B站','niconico'].map(x=>'<button class="'+(x===vp?'on':'')+'" data-vp="'+x+'">'+x+'</button>').join('');
    let L=A.videos.filter(v=>(!VT[vt]||VT[vt].includes(v.type))&&(vp==='全平台'||(v.platform||'YouTube')===vp)&&match(v.title+' '+v.channel));L.forEach(v=>v._d=v.contentDate||v.uploadDate||(v.years&&v.years[0])||'');L.sort((a,b)=>b._d.localeCompare(a._d));$('desc').textContent=L.length+' 条 · 从新到旧';html=grouped(L,vcard,false,'grid ls')}
  else if(g==='schedule'){$('desc').textContent='正在进行和接下来的安排。';let L=A.events.filter(e=>e.date>=today||(e.end&&e.end>=today)).filter(e=>match(e.title+e.japanese));L.forEach(e=>e._d=e.date);L.sort((a,b)=>a.date.localeCompare(b.date));html=grouped(L,tlrow,true,'tl')}
  else if(g==='all'){const GK=Object.keys(G).filter(k=>G[k].cats);$('chips').innerHTML=['全部',...GK].map(k=>'<button class="'+((k==='全部'?!window.ac:window.ac===k)?'on':'')+'" data-ac="'+k+'">'+(k==='全部'?'全部':G[k].t)+'</button>').join('');let L=A.events.filter(e=>(!window.ac||G[window.ac].cats.includes(e.category))&&match(e.title+e.japanese+e.role+e.category));L.forEach(e=>e._d=e.date);L.sort((a,b)=>b.date.localeCompare(a.date));$('desc').textContent=L.length+' 条记录 · 从新到旧 · '+G.all.d;html=grouped(L,tlrow,false,'tl')}
  else{const cats=G[g].cats;let L=A.events.filter(e=>cats.includes(e.category)).filter(e=>match(e.title+e.japanese+e.role+(e.note||'')));L.forEach(e=>e._d=e.date);L.sort((a,b)=>b.date.localeCompare(a.date));$('desc').textContent=L.length+' 条 · 从新到旧';const VM={radio:['广播／音声'],variety:['节目／其他'],int:['采访／发布会']};if(VM[g]){const used=new Set(L.flatMap(e=>[e.url,...(e.videos||[]).map(v=>v.url)]));const V=A.videos.filter(v=>VM[g].includes(v.type)&&!used.has(v.url)&&match(v.title+' '+v.channel));V.forEach(v=>{v._d=v.contentDate||v.uploadDate||(v.years&&v.years[0])||'';v._v=1});L=L.concat(V);L.sort((a,b)=>b._d.localeCompare(a._d));$('desc').textContent=L.length+' 条 · 从新到旧 · 含节目回放'}html=grouped(L,x=>x._v?vcard(x):card(x),false,G[g].ls?'grid ls':'grid')}
  $('out').innerHTML=html||'<div class="empty">暂无</div>';spy()}
$('q').oninput=e=>{filt=e.target.value.trim().toLowerCase();draw()};
document.querySelector('.tools:nth-of-type(2)').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.ac)window.ac=b.dataset.ac==='全部'?'':b.dataset.ac;if(b.dataset.vt)vt=b.dataset.vt;if(b.dataset.vp)vp=b.dataset.vp;draw()};
function spy(){const secs=[...document.querySelectorAll('main section')],links=[...document.querySelectorAll('#years a')];const f=()=>{let cur='';for(const s of secs)if(s.getBoundingClientRect().top<170)cur=s.id;links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+cur))};window.onscroll=f;f()}
document.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.style.visibility='hidden'},true);
draw();
